server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # A tela chama /api. O nginx entrega para o container da API.
    location /api/ {
        proxy_pass http://api:8080;
    }

    # Angular cuida das rotas. Qualquer endereço cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
