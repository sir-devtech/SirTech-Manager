<h2 mat-dialog-title>{{ cliente ? 'Editar cliente' : 'Novo cliente' }}</h2>
<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content class="campos">
    <mat-form-field>
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>CPF ou CNPJ</mat-label>
      <input matInput formControlName="documento" />
      @if (form.controls.documento.hasError('documento')) {
        <mat-error>CPF ou CNPJ inválido</mat-error>
      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>E-mail</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Produto</mat-label>
      <mat-select formControlName="produto">
        @for (produto of produtos; track produto.valor) {
          <mat-option [value]="produto.valor">{{ produto.rotulo }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Valor mensal</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="valorMensal" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Dia de vencimento</mat-label>
      <input matInput type="number" min="1" max="28" formControlName="diaVencimento" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Voltar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="salvando">Salvar</button>
  </mat-dialog-actions>
</form>
