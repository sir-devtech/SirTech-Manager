# Demonstração: dados fictícios e login de demonstração. Um comando sobe tudo:
#   docker compose up -d --build
# O uso real da empresa fica em outro arquivo, com outro banco: docker-compose.real.yml
#
# As portas escutam só em 127.0.0.1: o sistema abre neste computador e não aparece
# para outras máquinas da mesma rede (Wi-Fi de café, coworking).
# Os padrões são 4200 (tela), 8080 (API) e 5432 (banco). WEB_PORT, API_PORT e POSTGRES_PORT
# trocam as portas, e o nome do projeto (-p) separa os volumes. É assim que o teste de ponta a
# ponta (scripts/e2e.sh) sobe uma cópia descartável sem mexer na demonstração aberta.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sirtech}
      POSTGRES_USER: ${POSTGRES_USER:-sirtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirtech}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-demo:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sirtech} -d ${POSTGRES_DB:-sirtech}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sirtech}
      POSTGRES_USER: ${POSTGRES_USER:-sirtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirtech}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./backups:/app/backups

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"

volumes:
  pgdata-demo:
