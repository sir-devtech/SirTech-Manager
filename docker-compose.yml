# Demonstração: dados fictícios e login de demonstração. Um comando sobe tudo:
#   docker compose up -d --build
# O uso real da empresa fica em outro arquivo, com outro banco: docker-compose.real.yml
#
# As portas escutam só em 127.0.0.1: o sistema abre neste computador e não aparece
# para outras máquinas da mesma rede (Wi-Fi de café, coworking).
services:
  db:
    image: postgres:18
    container_name: sirtech-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sirtech}
      POSTGRES_USER: ${POSTGRES_USER:-sirtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirtech}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-demo:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sirtech} -d ${POSTGRES_DB:-sirtech}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: sirtech-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sirtech}
      POSTGRES_USER: ${POSTGRES_USER:-sirtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sirtech}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backups:/app/backups

  web:
    build: ./frontend
    container_name: sirtech-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:4200:80"

volumes:
  pgdata-demo:
