name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # segunda-feira, 09:00 UTC: pega falha nova em biblioteca antiga

jobs:
  backend:
    name: API (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testa com PostgreSQL de verdade (Testcontainers)
        run: ./mvnw -B verify
      - name: Cobertura no resumo do job
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          arquivo = 'target/site/jacoco-merged/jacoco.csv'
          if not os.path.exists(arquivo):
              print('Relatório de cobertura não gerado.')
          else:
              linhas = list(csv.DictReader(open(arquivo, encoding='utf-8')))
              def pct(m, c):
                  cob = sum(int(r[c]) for r in linhas); tot = cob + sum(int(r[m]) for r in linhas)
                  return f'{100 * cob / tot:.1f}%' if tot else '-'
              print('### Cobertura da API (testes unitários + integração)')
              print('| Linhas | Ramos |')
              print('|---|---|')
              print(f"| {pct('LINE_MISSED', 'LINE_COVERED')} | {pct('BRANCH_MISSED', 'BRANCH_COVERED')} |")
          PY
      - name: Relatório de cobertura (HTML)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-api
          path: backend/target/site/jacoco-merged
          if-no-files-found: ignore

  frontend:
    name: Tela (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependências da tela sem falha alta (npm audit)
        run: npm audit --audit-level=high
      - name: Testes da tela (Vitest)
        run: npx ng test --watch=false
      - name: Build de produção
        run: npx ng build

  dependencias:
    name: Dependências (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lê o pom.xml e o package-lock.json e compara com o banco de falhas conhecidas (osv.dev).
      # Falha o build se achar alguma. Roda também por agenda: uma falha nova pode aparecer
      # semanas depois, sem nenhum commit no projeto.
      - name: Procura falhas conhecidas nas bibliotecas
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/google/osv-scanner:v2.7.0             scan source -L backend/pom.xml -L frontend/package-lock.json -L e2e/package-lock.json

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    # Só roda depois que a API e a tela passaram: não gasta minutos subindo um sistema quebrado.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      # Sobe o sistema inteiro em Docker (banco, API e tela), abre um navegador de verdade, percorre
      # o fluxo principal e derruba tudo. O mesmo comando roda no computador do desenvolvedor.
      - name: Fluxo principal no navegador
        run: bash scripts/e2e.sh
      # Em caso de falha, o vídeo e o trace mostram o que o navegador viu.
      - name: Provas da falha (vídeo, trace e relatório)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-falha
          path: |
            e2e/resultados
            e2e/relatorio
          if-no-files-found: ignore
