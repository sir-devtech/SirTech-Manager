name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: API (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testa com PostgreSQL de verdade (Testcontainers)
        run: ./mvnw -B verify
      - name: Cobertura no resumo do job
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          arquivo = 'target/site/jacoco-merged/jacoco.csv'
          if not os.path.exists(arquivo):
              print('Relatório de cobertura não gerado.')
          else:
              linhas = list(csv.DictReader(open(arquivo, encoding='utf-8')))
              def pct(m, c):
                  cob = sum(int(r[c]) for r in linhas); tot = cob + sum(int(r[m]) for r in linhas)
                  return f'{100 * cob / tot:.1f}%' if tot else '-'
              print('### Cobertura da API (testes unitários + integração)')
              print('| Linhas | Ramos |')
              print('|---|---|')
              print(f"| {pct('LINE_MISSED', 'LINE_COVERED')} | {pct('BRANCH_MISSED', 'BRANCH_COVERED')} |")
          PY
      - name: Relatório de cobertura (HTML)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-api
          path: backend/target/site/jacoco-merged
          if-no-files-found: ignore

  frontend:
    name: Tela (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes da tela (Vitest)
        run: npx ng test --watch=false
      - name: Build de produção
        run: npx ng build
